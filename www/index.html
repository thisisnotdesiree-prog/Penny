```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny Counter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5ead7;
            font-family: Arial, sans-serif;
            color: #3b2a1f;
        }

        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        h1 {
            margin: 0 0 35px;
            font-size: 38px;
            font-weight: 700;
        }

        .counter {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .pennies {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            min-height: 105px;
            margin-bottom: 35px;
        }

        .penny {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #b87333;
            border: 5px solid #8c5426;
            box-shadow:
                inset 0 0 0 3px #d99a5b,
                0 5px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6b3d1c;
            font-size: 20px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        button {
            width: 150px;
            height: 60px;
            border: none;
            border-radius: 14px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            background: #6b4f3a;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s, opacity 0.1s;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>

    <main class="app">

        <h1>Penny Counter</h1>

        <div class="counter">
            <span id="count">0</span> / 3
        </div>

        <div class="pennies" id="pennies"></div>

        <div class="buttons">
            <button id="removeButton" onclick="removePenny()">
                − Remove
            </button>

            <button id="addButton" onclick="addPenny()">
                + Add
            </button>
        </div>

    </main>

    <script>
        let count = 0;
        const maximum = 3;

        const countDisplay = document.getElementById("count");
        const penniesDisplay = document.getElementById("pennies");
        const addButton = document.getElementById("addButton");
        const removeButton = document.getElementById("removeButton");

        function updateDisplay() {
            countDisplay.textContent = count;

            penniesDisplay.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const penny = document.createElement("div");
                penny.className = "penny";
                penny.textContent = "1¢";
                penniesDisplay.appendChild(penny);
            }

            addButton.disabled = count >= maximum;
            removeButton.disabled = count <= 0;
        }

        function addPenny() {
            if (count < maximum) {
                count++;
                updateDisplay();
            }
        }

        function removePenny() {
            if (count > 0) {
                count--;
                updateDisplay();
            }
        }

        updateDisplay();
    </script>

</body>
</html>
