<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Spencer's Beard</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #f3e8d2;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #49362b;
    }

    .game {
        width: 100%;
        height: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 18px 15px 15px;
    }

    h1 {
        margin: 0;
        font-size: clamp(28px, 8vw, 46px);
        line-height: 1;
        color: #49362b;
        text-align: center;
        text-shadow: 2px 2px #ead4b4;
    }

    .instructions {
        margin: 5px 0 0;
        font-size: clamp(14px, 4vw, 19px);
        text-align: center;
    }

    .stage {
        position: relative;
        width: min(88vw, 390px);
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /*
       The canvas is deliberately drawn at a low resolution and
       enlarged with image-rendering: pixelated. This gives Spencer
       a proper little retro game-sprite appearance.
    */
    #sprite {
        width: min(72vw, 300px);
        height: auto;
        max-height: 76vh;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: manipulation;
        cursor: pointer;
    }

    .tap-area {
        position: absolute;
        width: 55%;
        height: 42%;
        top: 22%;
        left: 22.5%;
        border-radius: 45%;
        cursor: pointer;
        touch-action: manipulation;
        background: transparent;
    }

    .controls {
        width: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 24px;
        padding-bottom: 4px;
    }

    .scissors-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }

    .scissors {
        font-family: sans-serif;
        font-size: 48px;
        line-height: 45px;
        transform: rotate(-18deg);
    }

    button {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background: #7b4f3b;
        border: 3px solid #49362b;
        border-radius: 12px;
        padding: 8px 20px;
        box-shadow: 0 4px 0 #49362b;
        cursor: pointer;
        touch-action: manipulation;
    }

    button:active {
        transform: translateY(4px);
        box-shadow: none;
    }

    .counter {
        font-size: 17px;
        margin-top: 4px;
    }

    @media (max-height: 650px) {
        .game {
            padding-top: 10px;
            padding-bottom: 8px;
        }

        h1 {
            font-size: 29px;
        }

        .instructions {
            font-size: 13px;
        }

        #sprite {
            width: min(58vw, 245px);
        }

        .scissors {
            font-size: 39px;
        }

        button {
            font-size: 17px;
            padding: 6px 16px;
        }
    }
</style>
</head>

<body>

<div class="game">

    <div>
        <h1>Spencer's Beard</h1>
        <div class="instructions">Tap Spencer's beard to grow it!</div>
    </div>

    <div class="stage">

        <canvas id="sprite"
                width="96"
                height="144"
                aria-label="Spencer">
        </canvas>

        <!-- Large invisible touch target over Spencer's face/beard -->
        <div class="tap-area" id="tapArea"></div>

    </div>

    <div class="controls">

        <div class="scissors-area">
            <div class="scissors">✂️</div>

            <button id="cutButton">
                CUT
            </button>

            <div class="counter">
                Beard: <span id="levelText">1</span>/10
            </div>
        </div>

    </div>

</div>

<script>
/* ============================================================
   SPENCER'S BEARD
   ============================================================ */

const canvas = document.getElementById("sprite");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const tapArea = document.getElementById("tapArea");
const cutButton = document.getElementById("cutButton");
const levelText = document.getElementById("levelText");

const MIN_LEVEL = 1;
const MAX_LEVEL = 10;

let beardLevel = parseInt(
    localStorage.getItem("spencersBeardLevel"),
    10
);

if (
    isNaN(beardLevel) ||
    beardLevel < MIN_LEVEL ||
    beardLevel > MAX_LEVEL
) {
    beardLevel = MIN_LEVEL;
}

/* ------------------------------------------------------------
   Pixel helper
   ------------------------------------------------------------ */

function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

/* ------------------------------------------------------------
   Draw Spencer
   ------------------------------------------------------------ */

function drawSpencer() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /*
       Palette
    */
    const outline = "#382923";
    const hairDark = "#3a2922";
    const hair = "#654331";
    const hairLight = "#805a3d";

    const skinShadow = "#c98e68";
    const skin = "#e2aa82";
    const skinLight = "#edbd91";

    const glasses = "#181818";
    const white = "#f5f0e7";

    const shirtDark = "#39465b";
    const shirt = "#56657b";
    const shirtLight = "#687991";

    const beardDark = "#76513b";
    const beard = "#956849";
    const beardLight = "#ad7955";

    /* --------------------------------------------------------
       BODY / SHIRT
       -------------------------------------------------------- */

    rect(25, 116, 46, 28, outline);

    rect(27, 119, 42, 25, shirtDark);
    rect(31, 119, 34, 25, shirt);

    /* Shirt collar */
    rect(42, 117, 12, 8, shirtLight);
    rect(44, 120, 8, 7, skinShadow);

    /* Small pixel shirt highlights */
    rect(29, 128, 4, 10, shirtLight);
    rect(63, 128, 4, 10, shirtLight);

    /* --------------------------------------------------------
       NECK
       -------------------------------------------------------- */

    rect(40, 103, 16, 18, outline);
    rect(42, 103, 12, 18, skinShadow);
    rect(44, 104, 8, 14, skin);

    /* --------------------------------------------------------
       EARS
       -------------------------------------------------------- */

    rect(17, 55, 9, 19, outline);
    rect(70, 55, 9, 19, outline);

    rect(19, 57, 6, 14, skin);
    rect(71, 57, 6, 14, skin);

    rect(20, 61, 3, 6, skinShadow);
    rect(73, 61, 3, 6, skinShadow);

    /* --------------------------------------------------------
       HEAD OUTLINE
       -------------------------------------------------------- */

    rect(25, 31, 46, 75, outline);

    /* Jaw / face */
    rect(27, 35, 42, 65, skin);
    rect(30, 31, 36, 69, skin);

    /* Face lighting */
    rect(31, 43, 4, 35, skinLight);
    rect(61, 43, 4, 35, skinShadow);

    /* Cheeks */
    rect(29, 72, 6, 7, "#dfa27d");
    rect(61, 72, 6, 7, "#d59670");

    /* --------------------------------------------------------
       HAIR
       -------------------------------------------------------- */

    /* Main hair mass */
    rect(25, 25, 46, 19, outline);
    rect(21, 31, 8, 31, outline);
    rect(67, 31, 8, 31, outline);

    rect(27, 27, 42, 17, hair);
    rect(24, 33, 7, 25, hair);
    rect(65, 33, 7, 25, hair);

    /* Hair top highlights */
    rect(31, 27, 17, 4, hairLight);
    rect(51, 27, 11, 4, hairLight);

    rect(27, 35, 5, 10, hairLight);
    rect(64, 35, 5, 10, hairDark);

    /* Hair fringe */
    rect(30, 40, 8, 8, hair);
    rect(38, 38, 8, 9, hair);
    rect(47, 39, 8, 8, hair);
    rect(56, 37, 8, 10, hair);

    /* Irregular pixel ends */
    rect(22, 47, 5, 12, hairDark);
    rect(69, 46, 5, 14, hairDark);

    /* --------------------------------------------------------
       GLASSES
       -------------------------------------------------------- */

    /* Frames */
    rect(27, 54, 18, 13, glasses);
    rect(51, 54, 18, 13, glasses);

    /* Bridge */
    rect(44, 57, 8, 4, glasses);

    /* Lens interiors */
    rect(30, 57, 12, 7, white);
    rect(54, 57, 12, 7, white);

    /* Lens tint */
    rect(31, 58, 10, 5, "#dce5e7");
    rect(55, 58, 10, 5, "#dce5e7");

    /* Eyes */
    rect(35, 59, 4, 5, outline);
    rect(57, 59, 4, 5, outline);

    /* Tiny eye highlights */
    rect(36, 59, 2, 2, "#ffffff");
    rect(58, 59, 2, 2, "#ffffff");

    /* --------------------------------------------------------
       NOSE
       -------------------------------------------------------- */

    rect(46, 64, 5, 13, skinShadow);
    rect(44, 76, 8, 3, skinShadow);
    rect(47, 73, 3, 3, skinLight);

    /* --------------------------------------------------------
       MOUTH
       -------------------------------------------------------- */

    /*
       The mouth is deliberately drawn BEFORE the beard,
       then redrawn afterward so it remains visible.
    */

    rect(41, 84, 14, 4, outline);
    rect(43, 83, 10, 2, "#9a514e");

    /* --------------------------------------------------------
       BEARD
       -------------------------------------------------------- */

    /*
       Beard begins around the jaw and grows downward.
       Each level adds another pixel-art section.
    */

    const growth = beardLevel;

    /*
       Sideburns
    */
    if (growth >= 1) {
        rect(27, 72, 7, 13, beardDark);
        rect(62, 72, 7, 13, beardDark);

        rect(29, 75, 5, 9, beard);
        rect(62, 75, 5, 9, beard);
    }

    /*
       Jaw
    */
    if (growth >= 2) {
        rect(32, 80, 32, 11, beard);
        rect(35, 87, 26, 8, beard);
    }

    /*
       Chin
    */
    if (growth >= 3) {
        rect(36, 91, 24, 9, beardDark);
        rect(39, 94, 18, 8, beard);
    }

    /*
       Longer beard
    */
    if (growth >= 4) {
        rect(37, 99, 22, 7, beard);
        rect(40, 105, 16, 6, beardDark);
    }

    if (growth >= 5) {
        rect(36, 106, 24, 7, beard);
        rect(39, 112, 18, 6, beardLight);
    }

    if (growth >= 6) {
        rect(34, 112, 28, 7, beard);
        rect(37, 118, 22, 7, beardDark);
    }

    if (growth >= 7) {
        rect(33, 119, 30, 7, beard);
        rect(36, 125, 24, 7, beardLight);
    }

    if (growth >= 8) {
        rect(31, 126, 34, 6, beardDark);
        rect(34, 131, 28, 7, beard);
    }

    if (growth >= 9) {
        rect(30, 132, 36, 5, beard);
        rect(34, 137, 28, 7, beardDark);
    }

    if (growth >= 10) {
        rect(29, 138, 38, 6, beardDark);
    }

    /*
       Beard texture highlights.
    */
    if (growth >= 2) {
        rect(34, 82, 4, 4, beardLight);
        rect(58, 83, 4, 4, beardLight);
    }

    if (growth >= 4) {
        rect(41, 99, 4, 5, beardLight);
        rect(53, 101, 4, 5, beardLight);
    }

    if (growth >= 6) {
        rect(37, 113, 4, 4, beardLight);
        rect(55, 115, 4, 4, beardLight);
    }

    if (growth >= 8) {
        rect(35, 128, 4, 4, beardLight);
        rect(57, 130, 4, 4, beardLight);
    }

    /*
       Moustache.
    */
    rect(39, 79, 18, 6, beardDark);
    rect(43, 78, 10, 4, beard);
    rect(45, 78, 6, 2, beardLight);

    /*
       Redraw the mouth over the beard.
       This keeps it visible even when the beard is long.
    */
    rect(41, 84, 14, 4, outline);
    rect(43, 84, 10, 2, "#9a514e");

    /*
       Little smile highlight.
    */
    rect(44, 84, 8, 1, "#d77a72");

    /*
       Beard outline pixels.
    */
    if (growth >= 3) {
        rect(35, 89, 4, 3, beardDark);
        rect(57, 89, 4, 3, beardDark);
    }

    /* --------------------------------------------------------
       FINAL PIXEL DETAILS
       -------------------------------------------------------- */

    /* Hair shine */
    rect(33, 30, 7, 2, "#987052");

    /* Glass shine */
    rect(30, 57, 3, 2, "#ffffff");
    rect(54, 57, 3, 2, "#ffffff");

    /* Ear details */
    rect(20, 63, 2, 4, skinShadow);
    rect(74, 63, 2, 4, skinShadow);
}


/* ------------------------------------------------------------
   GAME FUNCTIONS
   ------------------------------------------------------------ */

function updateGame() {

    levelText.textContent = beardLevel;

    drawSpencer();

    localStorage.setItem(
        "spencersBeardLevel",
        beardLevel
    );
}


function growBeard() {

    if (beardLevel < MAX_LEVEL) {
        beardLevel++;
        updateGame();
    }
}


function cutBeard() {

    if (beardLevel > MIN_LEVEL) {
        beardLevel--;
        updateGame();
    }
}


/* ------------------------------------------------------------
   TOUCH / CLICK
   ------------------------------------------------------------ */

tapArea.addEventListener("click", function(event) {
    event.preventDefault();
    growBeard();
});

canvas.addEventListener("click", function(event) {
    event.preventDefault();
    growBeard();
});

cutButton.addEventListener("click", function(event) {
    event.preventDefault();
    event.stopPropagation();
    cutBeard();
});


/* ------------------------------------------------------------
   START
   ------------------------------------------------------------ */

updateGame();

</script>

</body>
</html>
```
