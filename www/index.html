
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#f5ead8">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- iPhone / iPad -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Penny Counter">

    <title>Penny Counter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5ead8;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #4a2c1a;
            font-size: 32px;
        }

        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        button {
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 50%;
            background: #8b5e3c;
            color: white;
            font-size: 36px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #count {
            min-width: 100px;
            font-size: 64px;
            font-weight: bold;
            color: #4a2c1a;
        }

        .label {
            margin-top: 15px;
            font-size: 20px;
            color: #6b4a35;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Penny Counter</h1>

        <div class="counter">
            <button id="subtract">−</button>

            <div id="count">0</div>

            <button id="add">+</button>
        </div>

        <div class="label">pennies</div>
    </div>

    <script>
        let count = parseInt(localStorage.getItem("pennyCount")) || 0;

        const countDisplay = document.getElementById("count");
        const addButton = document.getElementById("add");
        const subtractButton = document.getElementById("subtract");

        function updateCount() {
            countDisplay.textContent = count;

            // Save the number on the device.
            localStorage.setItem("pennyCount", count);

            addButton.disabled = count >= 3;
            subtractButton.disabled = count <= 0;
        }

        addButton.addEventListener("click", function () {
            if (count < 3) {
                count++;
                updateCount();
            }
        });

        subtractButton.addEventListener("click", function () {
            if (count > 0) {
                count--;
                updateCount();
            }
        });

        updateCount();

        // Register the service worker for offline/PWA support.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js")
                    .catch(function (error) {
                        console.log("Service Worker registration failed:", error);
                    });
            });
        }
    </script>

</body>
</html>
