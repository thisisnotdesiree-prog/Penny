<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Spencer's Beard</title>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    background:
        linear-gradient(
            #f7e8ca 0%,
            #f1dcb9 100%
        );

    font-family:
        "Comic Sans MS",
        "Comic Sans",
        cursive;

    touch-action: manipulation;
}

.game {
    position: relative;

    width: 100%;
    height: 100vh;

    max-width: 600px;

    margin: auto;

    overflow: hidden;
}


/* =========================================================
   TITLE
========================================================= */

.title {
    position: absolute;

    top: 8px;
    left: 0;

    width: 100%;

    text-align: center;

    font-family:
        "Comic Sans MS",
        "Comic Sans",
        cursive;

    font-size: clamp(27px, 8vw, 45px);

    font-weight: bold;

    color: #4a2d1c;

    text-shadow:
        2px 2px 0 #d6bd97;

    z-index: 200;
}

.instructions {
    position: absolute;

    top: 58px;
    left: 0;

    width: 100%;

    text-align: center;

    color: #76553b;

    font-size: 14px;

    z-index: 200;
}


/* =========================================================
   CHARACTER
========================================================= */

.character {
    position: absolute;

    width: 260px;
    height: 520px;

    left: 50%;
    top: 82px;

    transform: translateX(-50%);

    image-rendering: pixelated;
}


/* =========================================================
   HAIR
========================================================= */

.hair {
    position: absolute;

    left: 55px;
    top: 3px;

    width: 150px;
    height: 78px;

    background: #51301c;

    border: 5px solid #302016;

    z-index: 4;
}

/* Hair chunks */

.hair::before {
    content: "";

    position: absolute;

    left: -12px;
    top: 18px;

    width: 18px;
    height: 48px;

    background: #51301c;

    box-shadow:
        156px 2px #51301c,
        142px -13px #51301c,
        18px -12px #51301c,
        48px -17px #51301c,
        82px -12px #51301c;
}

/* Hair highlights */

.hair::after {
    content: "";

    position: absolute;

    left: 18px;
    top: 12px;

    width: 20px;
    height: 12px;

    background: #704426;

    box-shadow:
        39px -5px #704426,
        76px 0 #704426,
        107px -4px #704426;
}


/* =========================================================
   EARS
========================================================= */

.ear {
    position: absolute;

    top: 105px;

    width: 25px;
    height: 43px;

    background: #dda074;

    border: 4px solid #3c281d;

    z-index: 2;
}

.ear.left {
    left: 39px;
}

.ear.right {
    right: 39px;
}


/* =========================================================
   FACE
========================================================= */

.face {
    position: absolute;

    left: 52px;
    top: 54px;

    width: 156px;
    height: 155px;

    background: #e5a676;

    border: 5px solid #3c281d;

    z-index: 3;
}


/* Pixel shading on face */

.face::after {
    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 18px;
    height: 62px;

    background: #d39267;

    opacity: .65;
}


/* =========================================================
   GLASSES
========================================================= */

.glasses {
    position: absolute;

    left: 42px;
    top: 100px;

    width: 176px;
    height: 48px;

    z-index: 15;
}

.lens {
    position: absolute;

    top: 0;

    width: 70px;
    height: 43px;

    background: rgba(215, 232, 235, .42);

    border: 5px solid #171717;
}

.lens.left {
    left: 0;
}

.lens.right {
    right: 0;
}

.bridge {
    position: absolute;

    left: 66px;
    top: 14px;

    width: 45px;
    height: 7px;

    background: #171717;
}

.glass-arm {
    position: absolute;

    top: 10px;

    width: 20px;
    height: 6px;

    background: #171717;
}

.glass-arm.left {
    left: -17px;
}

.glass-arm.right {
    right: -17px;
}


/* =========================================================
   EYES
========================================================= */

.eye {
    position: absolute;

    top: 116px;

    width: 8px;
    height: 9px;

    background: #171717;

    z-index: 18;
}

.eye.left {
    left: 80px;
}

.eye.right {
    left: 171px;
}


/* =========================================================
   NOSE
========================================================= */

.nose {
    position: absolute;

    left: 119px;
    top: 139px;

    width: 15px;
    height: 23px;

    background: #c98156;

    z-index: 12;
}


/* =========================================================
   MOUTH
   IMPORTANT:
   This is ABOVE the beard.
========================================================= */

.mouth {
    position: absolute;

    left: 101px;
    top: 168px;

    width: 58px;
    height: 19px;

    background: #7a3d35;

    border: 4px solid #3a241b;

    z-index: 80;

    /*
       Rounded pixel-art smile.
    */

    clip-path: polygon(
        0 0,
        100% 0,
        100% 45%,
        85% 45%,
        85% 75%,
        70% 75%,
        70% 100%,
        30% 100%,
        30% 75%,
        15% 75%,
        15% 45%,
        0 45%
    );
}

/* Teeth */

.mouth::after {
    content: "";

    position: absolute;

    left: 10px;
    top: 2px;

    width: 30px;
    height: 5px;

    background: #fff3dc;
}


/* =========================================================
   NECK
========================================================= */

.neck {
    position: absolute;

    left: 101px;
    top: 202px;

    width: 58px;
    height: 47px;

    background: #d79668;

    border-left: 5px solid #3c281d;
    border-right: 5px solid #3c281d;

    z-index: 2;
}


/* =========================================================
   SHIRT / TORSO
========================================================= */

.shirt {
    position: absolute;

    left: 27px;
    top: 236px;

    width: 206px;
    height: 270px;

    background: #40566c;

    border: 6px solid #273646;

    clip-path: polygon(
        27% 0,
        73% 0,
        100% 16%,
        91% 100%,
        9% 100%,
        0 16%
    );

    z-index: 1;
}

/* Shirt center */

.shirt::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 9px;
    height: 270px;

    transform: translateX(-50%);

    background: #526b84;
}


/* =========================================================
   BEARD TOUCH AREA
========================================================= */

/*
   This is intentionally much larger than the visible beard.
   It makes tapping the beard extremely reliable on Android.
*/

.beard-touch {
    position: absolute;

    left: 39px;
    top: 145px;

    width: 182px;
    height: 350px;

    z-index: 100;

    cursor: pointer;

    touch-action: manipulation;
}


/* =========================================================
   BEARD
========================================================= */

.beard {
    position: absolute;

    left: 25px;
    top: 14px;

    width: 132px;

    background: #765036;

    border-left: 5px solid #533722;
    border-right: 5px solid #533722;

    transition:
        height .18s ease,
        width .18s ease;

    image-rendering: pixelated;

    /*
       More natural beard silhouette.
    */

    clip-path: polygon(
        0 0,
        16% 0,
        16% 8%,
        84% 8%,
        84% 0,
        100% 0,

        100% 15%,
        94% 15%,
        94% 28%,

        88% 28%,
        88% 48%,

        82% 48%,
        82% 70%,

        74% 70%,
        74% 87%,

        63% 87%,
        63% 100%,

        50% 94%,

        37% 100%,
        37% 87%,

        26% 87%,
        26% 70%,

        18% 70%,
        18% 48%,

        12% 48%,
        12% 28%,

        6% 28%,
        6% 15%,

        0 15%
    );

    z-index: 40;
}


/* =========================================================
   BEARD PIXEL TEXTURE
========================================================= */

.beard::before {
    content: "";

    position: absolute;

    inset: 0;

    background:

        /* lighter pixel highlights */
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 9px,
            rgba(182,133,87,.30) 9px,
            rgba(182,133,87,.30) 13px,
            transparent 13px,
            transparent 19px
        ),

        /* darker hair pixels */
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 12px,
            rgba(58,38,25,.32) 12px,
            rgba(58,38,25,.32) 16px
        );

    z-index: 1;
}


/* Individual beard levels */

.beard.level-1 {
    height: 28px;
}

.beard.level-2 {
    height: 53px;
}

.beard.level-3 {
    height: 80px;
}

.beard.level-4 {
    height: 112px;
}

.beard.level-5 {
    height: 148px;
}

.beard.level-6 {
    height: 187px;
}

.beard.level-7 {
    height: 228px;
}

.beard.level-8 {
    height: 269px;
}

.beard.level-9 {
    height: 309px;
}

.beard.level-10 {
    height: 347px;
}


/* =========================================================
   MOUSTACHE
========================================================= */

.moustache {
    position: absolute;

    left: 74px;
    top: 157px;

    width: 86px;
    height: 24px;

    background: #69462f;

    z-index: 90;

    clip-path: polygon(
        0 20%,
        25% 20%,
        40% 0,
        50% 25%,
        60% 0,
        75% 20%,
        100% 20%,
        100% 70%,
        85% 70%,
        75% 100%,
        60% 100%,
        50% 72%,
        40% 100%,
        25% 100%,
        15% 70%,
        0 70%
    );
}


/* =========================================================
   SCISSORS
========================================================= */

.controls {
    position: absolute;

    right: 8px;
    top: 165px;

    width: 100px;

    text-align: center;

    z-index: 180;
}

.scissors {
    font-family: Arial, sans-serif;

    font-size: 51px;

    line-height: 1;

    margin-bottom: 9px;

    transform: rotate(-12deg);
}

.cut-button {
    border: 4px solid #43291a;

    background: #d8a64b;

    color: #2f1d12;

    font-family:
        "Comic Sans MS",
        "Comic Sans",
        cursive;

    font-size: 19px;

    font-weight: bold;

    padding: 8px 15px;

    border-radius: 10px;

    box-shadow:
        4px 4px 0 #43291a;

    cursor: pointer;

    touch-action: manipulation;
}

.cut-button:active {
    transform: translate(3px, 3px);

    box-shadow:
        1px 1px 0 #43291a;
}


/* =========================================================
   COUNTER
========================================================= */

.counter {
    position: absolute;

    left: 50%;
    bottom: 9px;

    transform: translateX(-50%);

    background: #fff8e9;

    border: 3px solid #43291a;

    border-radius: 18px;

    padding: 5px 14px;

    color: #43291a;

    font-size: 14px;

    white-space: nowrap;

    z-index: 200;
}


/* =========================================================
   GROW ANIMATION
========================================================= */

.beard.growing {
    animation: beardGrow .18s ease;
}

@keyframes beardGrow {

    0% {
        transform: scaleY(.96);
        transform-origin: top;
    }

    60% {
        transform: scaleY(1.04);
        transform-origin: top;
    }

    100% {
        transform: scaleY(1);
        transform-origin: top;
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 390px) {

    .character {
        transform:
            translateX(-50%)
            scale(.84);

        transform-origin:
            top center;
    }

    .controls {
        right: 0;

        transform: scale(.82);

        transform-origin:
            top right;
    }
}


/* =========================================================
   SHORT SCREENS
========================================================= */

@media (max-height: 650px) {

    .character {
        top: 76px;

        transform:
            translateX(-50%)
            scale(.72);

        transform-origin:
            top center;
    }

    .controls {
        top: 145px;

        transform: scale(.78);

        transform-origin:
            top right;
    }
}

</style>
</head>


<body>

<div class="game">


    <!-- TITLE -->

    <div class="title">
        Spencer's Beard
    </div>

    <div class="instructions">
        Tap Spencer's beard to grow it!
    </div>


    <!-- =====================================================
         CHARACTER
    ====================================================== -->

    <div class="character">


        <!-- Hair -->

        <div class="hair"></div>


        <!-- Ears -->

        <div class="ear left"></div>
        <div class="ear right"></div>


        <!-- Face -->

        <div class="face"></div>


        <!-- Glasses -->

        <div class="glasses">

            <div class="lens left"></div>
            <div class="lens right"></div>

            <div class="bridge"></div>

            <div class="glass-arm left"></div>
            <div class="glass-arm right"></div>

        </div>


        <!-- Eyes -->

        <div class="eye left"></div>
        <div class="eye right"></div>


        <!-- Nose -->

        <div class="nose"></div>


        <!-- =================================================
             BEARD TOUCH AREA
        ================================================== -->

        <div
            id="beardTouch"
            class="beard-touch"
            aria-label="Tap to grow beard"
        >

            <!-- Beard -->

            <div
                id="beard"
                class="beard level-1"
            ></div>

        </div>


        <!-- MOUSTACHE -->

        <div class="moustache"></div>


        <!-- MOUTH
             Deliberately positioned ABOVE beard -->
        <div class="mouth"></div>


        <!-- Neck -->

        <div class="neck"></div>


        <!-- Shirt -->

        <div class="shirt"></div>

    </div>


    <!-- =====================================================
         SCISSORS
    ====================================================== -->

    <div class="controls">

        <div class="scissors">
            ✂
        </div>

        <button
            id="cutButton"
            class="cut-button"
        >
            CUT
        </button>

    </div>


    <!-- COUNTER -->

    <div
        id="counter"
        class="counter"
    >
        Beard length: 1 / 10
    </div>

</div>


<script>

/* =========================================================
   SPENCER'S BEARD
========================================================= */

const beard =
    document.getElementById("beard");

const beardTouch =
    document.getElementById("beardTouch");

const cutButton =
    document.getElementById("cutButton");

const counter =
    document.getElementById("counter");


const MIN_LEVEL = 1;
const MAX_LEVEL = 10;


/* =========================================================
   LOAD SAVED BEARD
========================================================= */

let beardLevel =
    parseInt(
        localStorage.getItem(
            "spencersBeardLevel"
        ),
        10
    );


if (
    isNaN(beardLevel) ||
    beardLevel < MIN_LEVEL ||
    beardLevel > MAX_LEVEL
) {
    beardLevel = MIN_LEVEL;
}


/* =========================================================
   UPDATE DISPLAY
========================================================= */

function updateBeard() {

    /*
       Remove every possible level.
    */

    for (
        let i = MIN_LEVEL;
        i <= MAX_LEVEL;
        i++
    ) {

        beard.classList.remove(
            "level-" + i
        );

    }


    /*
       Apply current level.
    */

    beard.classList.add(
        "level-" + beardLevel
    );


    /*
       Save current level.
       This means the beard stays the same
       after closing and reopening the app.
    */

    localStorage.setItem(
        "spencersBeardLevel",
        String(beardLevel)
    );


    /*
       Update counter.
    */

    counter.textContent =
        "Beard length: " +
        beardLevel +
        " / " +
        MAX_LEVEL;
}


/* =========================================================
   GROW
========================================================= */

function growBeard() {

    if (beardLevel < MAX_LEVEL) {

        beardLevel++;

        updateBeard();


        /*
           Restart animation.
        */

        beard.classList.remove(
            "growing"
        );

        void beard.offsetWidth;

        beard.classList.add(
            "growing"
        );

    }

}


/* =========================================================
   CUT
========================================================= */

function cutBeard() {

    if (beardLevel > MIN_LEVEL) {

        beardLevel--;

        updateBeard();

    }

}


/* =========================================================
   TAP BEARD
========================================================= */

/*
   CLICK is intentionally attached to the LARGE
   invisible beard-touch area rather than the
   visible beard itself.

   This makes it much easier to tap on a phone.
*/

beardTouch.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        growBeard();

    }
);


/* =========================================================
   CUT BUTTON
========================================================= */

cutButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        cutBeard();

    }
);


/* =========================================================
   START
========================================================= */

updateBeard();

</script>

</body>
</html>
```
