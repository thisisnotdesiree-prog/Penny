<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5ead7">
<meta name="mobile-web-app-capable" content="yes">
<title>Penny Counter</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #f5ead7;
        font-family: Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    .widget {
        width: 100%;
        max-width: 380px;
        padding: 25px;
        text-align: center;
        background: white;
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    h1 { margin-top: 0; color: #7b4a28; }
    .pennies {
        min-height: 110px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 20px 0;
    }
    .penny {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #e9a66f, #b86435 55%, #7d3d20);
        border: 4px solid #8c4928;
        box-shadow: inset 2px 2px 5px rgba(255,255,255,.35), 3px 4px 7px rgba(0,0,0,.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #713516;
        font-size: 28px;
        font-weight: bold;
    }
    .count { font-size: 22px; font-weight: bold; color: #444; margin-bottom: 20px; }
    button {
        width: 100%;
        padding: 16px;
        margin: 6px 0;
        border: none;
        border-radius: 14px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
    }
    .add { background: #55b96b; color: white; }
    .remove { background: #e15b5b; color: white; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="widget">
    <h1>🪙 Pennies</h1>
    <div class="pennies" id="pennies"></div>
    <div class="count"><span id="count">3</span> / 3 pennies</div>
    <button class="add" id="addButton" onclick="addPenny()">+ Add Penny</button>
    <button class="remove" id="removeButton" onclick="removePenny()">− Remove Penny</button>
</div>
<script>
    let pennyCount = 3;
    const maxPennies = 3;
    function updateDisplay() {
        const container = document.getElementById("pennies");
        const count = document.getElementById("count");
        const addButton = document.getElementById("addButton");
        const removeButton = document.getElementById("removeButton");
        container.innerHTML = "";
        for (let i = 0; i < pennyCount; i++) {
            const penny = document.createElement("div");
            penny.className = "penny";
            penny.textContent = "¢";
            container.appendChild(penny);
        }
        count.textContent = pennyCount;
        addButton.disabled = pennyCount >= maxPennies;
        removeButton.disabled = pennyCount <= 0;
    }
    function addPenny() {
        if (pennyCount < maxPennies) { pennyCount++; updateDisplay(); }
    }
    function removePenny() {
        if (pennyCount > 0) { pennyCount--; updateDisplay(); }
    }
    updateDisplay();
</script>
</body>
</html>
